# Build single compane-profile image and push to Aliyun ACR.
# Trigger: git tag v*  OR  workflow_dispatch
#
# ACR credentials from GitHub Secrets / Environments (not repo .env files):
#   Repository secrets: ACR_USERNAME, ACR_PASSWORD
#   Environment test/prod: REGISTRY (server pull address; may include -vpc)
# CI push host is derived by stripping "-vpc." from REGISTRY.

name: docker-acr

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target_env:
        description: Push target environment
        required: true
        type: choice
        options:
          - test
          - prod
      image_tag:
        description: Image tag (e.g. v0.0.1); must match server IMAGE_TAG
        required: true
        type: string

jobs:
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.resolve.outputs.deploy_env }}
      primary_tag: ${{ steps.resolve.outputs.primary_tag }}
    steps:
      - name: Resolve env and tag
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          DISPATCH_ENV: ${{ inputs.target_env }}
          DISPATCH_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            deploy_env="${DISPATCH_ENV}"
            primary_tag="${DISPATCH_TAG}"
          elif [[ "${GIT_REF}" == refs/tags/* ]]; then
            primary_tag="${GIT_REF#refs/tags/}"
            if [[ "${primary_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              deploy_env=prod
            else
              deploy_env=test
            fi
          else
            echo "::error::unsupported ref ${GIT_REF}"
            exit 1
          fi
          echo "deploy_env=${deploy_env}" >> "${GITHUB_OUTPUT}"
          echo "primary_tag=${primary_tag}" >> "${GITHUB_OUTPUT}"

  build-push:
    needs: resolve-env
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.deploy_env }}
    steps:
      - uses: actions/checkout@v4

      - name: Load ACR secrets
        id: acr
        shell: bash
        env:
          REGISTRY_PULL: ${{ secrets.REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          PRIMARY_TAG: ${{ needs.resolve-env.outputs.primary_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${REGISTRY_PULL}" || -z "${ACR_USERNAME}" || -z "${ACR_PASSWORD}" ]]; then
            echo "::error::missing REGISTRY / ACR_USERNAME / ACR_PASSWORD"
            exit 1
          fi
          registry_push="${REGISTRY_PULL/-vpc./.}"
          if [[ "${registry_push}" == *"-vpc."* ]]; then
            echo "::error::REGISTRY still contains -vpc after strip"
            exit 1
          fi
          echo "::add-mask::${ACR_PASSWORD}"
          echo "registry=${registry_push}" >> "${GITHUB_OUTPUT}"
          echo "host=${registry_push%%/*}" >> "${GITHUB_OUTPUT}"
          echo "username=${ACR_USERNAME}" >> "${GITHUB_OUTPUT}"
          echo "password=${ACR_PASSWORD}" >> "${GITHUB_OUTPUT}"
          echo "primary_tag=${PRIMARY_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Login ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr.outputs.host }}
          username: ${{ steps.acr.outputs.username }}
          password: ${{ steps.acr.outputs.password }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: manifest/docker/Dockerfile
          push: true
          tags: |
            ${{ steps.acr.outputs.registry }}/compane-profile:${{ steps.acr.outputs.primary_tag }}
            ${{ steps.acr.outputs.registry }}/compane-profile:${{ github.sha }}
